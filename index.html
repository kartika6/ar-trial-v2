<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Couch V2 Prototype</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111; color: #fff; overflow: hidden;
    }
    model-viewer { width: 100vw; height: 100vh; background-color: #1e1e1e; }

    /* ---------- Color panel: same element in object view AND AR camera view ---------- */
    .color-panel {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: 14px 10px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.25);
      z-index: 100;
    }
    .panel-label {
      font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
      color: #ddd;
    }
    .swatch {
      width: 44px; height: 44px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.35);
      cursor: pointer; font-size: 16px; color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,.4);
      transition: transform .15s ease, border-color .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .swatch:active { transform: scale(.88); }
    .swatch.selected { border-color: #fff; transform: scale(1.08); }
    .swatch.red  { background: #A62007; }
    .swatch.blue { background: #074CA6; }
    .swatch.orig { background: linear-gradient(135deg, #d8c3a5 50%, #8b7d6b 50%); }
    .divider { width: 60%; height: 1px; background: rgba(255,255,255,.25); }
    .size-btn {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid #00ffcc; background: rgba(0,0,0,.6); color: #00ffcc;
      font-size: 18px; cursor: pointer;
    }
    .size-btn.on { background: #00ffcc; color: #111; }

    /* ---------- Status / guidance banner (visible in AR too) ---------- */
    .banner {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      max-width: 88%; text-align: center;
      background: rgba(17,17,17,.92); border: 1px solid #ff9900; color: #fff;
      padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 600;
      z-index: 100; transition: opacity .4s ease; pointer-events: none;
    }
    .banner.warn { border-color: #ff5252; }
    .banner.ok   { border-color: #3ddc84; }

    /* ---------- Dimension card (works in AR, since AR hotspots don't render) ---------- */
    .dim-card {
      position: absolute; left: 14px; bottom: 90px;
      background: rgba(0,0,0,.85); border: 1.5px solid #00ffcc; color: #00ffcc;
      padding: 10px 14px; border-radius: 16px; font-size: 13px; font-weight: 600;
      line-height: 1.6; z-index: 100; pointer-events: none;
    }
    .dim-tag {
      background: rgba(0,0,0,.85); color: #00ffcc; border: 1.5px solid #00ffcc;
      padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600;
      pointer-events: none; white-space: nowrap;
    }

    .ar-enter-btn {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; background: #ff9900; color: #111; font-weight: 700;
      border: none; border-radius: 30px; font-size: 15px;
      box-shadow: 0 4px 16px rgba(0,0,0,.5); z-index: 100;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!--
    KEY IDEA: in WebXR (Android Chrome), every child of <model-viewer> is shown
    as a DOM overlay on top of the camera feed. So the color panel lives INSIDE
    <model-viewer> and appears in both object view and AR camera view.
  -->
  <model-viewer
    id="couch-viewer"
    src="couch.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed"
    camera-controls
    shadow-intensity="1"
    alt="3D couch model">

    <!-- Guidance / feedback banner -->
    <div id="banner" class="banner hidden"></div>

    <!-- Color panel (persistent in both views) -->
    <div id="color-panel" class="color-panel">
      <span class="panel-label">Color</span>
      <button class="swatch red"  data-color="#A62007" aria-label="Red"></button>
      <button class="swatch blue" data-color="#074CA6" aria-label="Blue"></button>
      <button class="swatch orig selected" data-color="original" aria-label="Original color">↺</button>
      <div class="divider"></div>
      <button id="size-btn" class="size-btn" aria-label="Show dimensions">📏</button>
    </div>

    <!-- Dimension card (shown in object view + AR) -->
    <div id="dim-card" class="dim-card hidden">
      ⟷ Length: 84 in<br>⤢ Depth: 38 in<br>↕ Height: 34 in
    </div>

    <!-- AR launch button (only meaningful in object view) -->
    <button slot="ar-button" class="ar-enter-btn">View in Your Room (AR)</button>

    <!-- Object-view hotspots -->
    <button slot="hotspot-length" class="dim-tag hidden" data-position="0m 0.85m 0m" data-normal="0m 1m 0m">⟷ 84 in</button>
    <button slot="hotspot-depth"  class="dim-tag hidden" data-position="1m 0.45m 0m" data-normal="1m 0m 0m">⤢ 38 in</button>
    <button slot="hotspot-height" class="dim-tag hidden" data-position="-1m 0.45m 0m" data-normal="-1m 0m 0m">↕ 34 in</button>
  </model-viewer>

  <script>
    const mv = document.querySelector('#couch-viewer');
    const banner = document.querySelector('#banner');
    const panel = document.querySelector('#color-panel');
    const dimCard = document.querySelector('#dim-card');
    const sizeBtn = document.querySelector('#size-btn');
    const swatches = document.querySelectorAll('.swatch');
    let originalColors = [];
    let dimsOn = false;
    let bannerTimer;

    /* --- Stop taps on our UI from being treated as AR "place/move" taps --- */
    [panel, sizeBtn].forEach(el => {
      el.addEventListener('beforexrselect', e => e.preventDefault());
    });

    /* --- Remember original colors --- */
    mv.addEventListener('load', () => {
      originalColors = mv.model.materials.map(m => [...m.pbrMetallicRoughness.baseColorFactor]);
    });

    /* --- Color change (works in object view and live in AR) --- */
    function applyColor(value) {
      if (!mv.model) return;
      mv.model.materials.forEach((mat, i) => {
        if (value === 'original') {
          if (originalColors[i]) mat.pbrMetallicRoughness.setBaseColorFactor(originalColors[i]);
        } else {
          mat.pbrMetallicRoughness.setBaseColorFactor(hexToRgba(value));
        }
      });
    }
    function hexToRgba(hex) {
      return [
        parseInt(hex.slice(1, 3), 16) / 255,
        parseInt(hex.slice(3, 5), 16) / 255,
        parseInt(hex.slice(5, 7), 16) / 255,
        1
      ];
    }
    swatches.forEach(btn => {
      btn.addEventListener('click', () => {
        applyColor(btn.dataset.color);
        swatches.forEach(s => s.classList.remove('selected'));
        btn.classList.add('selected');
        showBanner('Color updated — walk around to see it in your room', 'ok', 2000);
      });
    });

    /* --- Dimensions toggle --- */
    sizeBtn.addEventListener('click', () => {
      dimsOn = !dimsOn;
      sizeBtn.classList.toggle('on', dimsOn);
      dimCard.classList.toggle('hidden', !dimsOn);
      document.querySelectorAll('.dim-tag').forEach(el => el.classList.toggle('hidden', !dimsOn));
    });

    /* --- Banner helper --- */
    function showBanner(text, state = '', ms = 0) {
      clearTimeout(bannerTimer);
      banner.textContent = text;
      banner.className = 'banner ' + state;
      if (ms) bannerTimer = setTimeout(() => banner.classList.add('hidden'), ms);
    }

    /* --- AR session feedback & recovery --- */
    mv.addEventListener('ar-status', (e) => {
      const s = e.detail.status;
      if (s === 'session-started') {
        showBanner('📐 Slowly scan the floor, then tap to place the couch');
      } else if (s === 'object-placed') {
        showBanner('✅ Placed! Change color with the side panel · drag to move · two fingers to rotate', 'ok', 5000);
      } else if (s === 'failed') {
        showBanner('AR could not start. Try Android Chrome with ARCore.', 'warn', 6000);
      } else {
        banner.classList.add('hidden');   // not-presenting: back to object view
      }
    });

    /* --- Tracking lost / regained (recovery moment) --- */
    mv.addEventListener('ar-tracking', (e) => {
      if (e.detail.status === 'not-tracking') {
        showBanner('⚠️ Lost tracking — move your phone slowly and point at the floor', 'warn');
      } else {
        showBanner('Tracking recovered', 'ok', 1800);
      }
    });
  </script>
</body>
</html>
